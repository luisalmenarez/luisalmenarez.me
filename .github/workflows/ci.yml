name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push supersedes the run already in flight for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Single source of truth: .nvmrc, which matches the `engines` field.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Runs the strict tsconfig over .ts and .astro alike. This is what keeps
      # the es/en blocks of ui.ts from drifting: `en` is typed against the keys
      # of `es`, so a forgotten translation fails here instead of silently
      # falling back at runtime.
      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build
