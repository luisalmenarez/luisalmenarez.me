<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    L monogram on a solid indigo tile.

    The tile is deliberate: a bare glyph relying on prefers-color-scheme (as the
    default Astro mark did) washes out at 16px against the browser's own tab
    colour, which is neither pure white nor pure black. A solid tile carries its
    own contrast, so one file covers both themes.

    Letterform sized for 16px first: A larger stroke than this crowds the tile's
    corner radius, a smaller one turns to mush in the tab strip.
  -->
  <rect width="64" height="64" rx="14" fill="#4f46e5" />
  <path d="M16 15h12v22h20v12H16z" fill="#fff" />
</svg>
